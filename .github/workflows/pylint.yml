name: Pylint

# pylint job: unchanged from main — still gates via Pylint / pylint (regression gate).
# Pinwheel: pytest==9.1.1 from fresh Python 3.12.13 isolated venv (execution-time evidence
# recorded in tests/test_ci_contract.py; candidate baseline 2026-08-16T04:46:06Z).
# pytest job: additive hermetic suite; safe to merge before ruleset adds Pylint / pytest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "Secret scan cannot resolve a non-null comparison base" >&2
            exit 1
          fi
          python scripts/secret_scan.py --diff-range "${BASE_SHA}" "${HEAD_SHA}"

      - name: Scan tracked checkout
        run: python scripts/secret_scan.py --tree

  pylint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Need base SHA history to read ci/pylint-baseline.json from PR base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Regenerate ci/pylint-baseline.json on ubuntu-latest with the same
      # install steps (requirements + pylint==4.0.6 + pytest==9.1.1). Do not use a
      # local env that adds stray packages or scripts/__init__.py package marks.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint==4.0.6 pytest==9.1.1

      - name: Log pytest version
        run: python -m pytest --version

      - name: Run Pylint (JSON report)
        id: pylint_run
        run: |
          # Capture the report even when pylint exits non-zero for preexisting debt.
          # Do not use pylint --exit-zero; the regression gate owns pass/fail.
          set +e
          pylint $(git ls-files "*.py") --output-format=json > pylint-report.json
          pylint_status=$?
          set -e
          echo "pylint_exit=$pylint_status"
          echo "pylint_status=$pylint_status" >> "$GITHUB_OUTPUT"
          test -s pylint-report.json

      - name: Pylint regression gate
        env:
          PYLINT_STATUS: ${{ steps.pylint_run.outputs.pylint_status }}
          # PR checks: base.sha. Push to main: event.before (prior tip).
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Live findings and any baseline edit are compared against BASE_REF.
          # Null / empty before (branch creation) must fail closed — never bootstrap.
          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            echo "Baseline resolution FAIL: BASE_REF missing or null OID"
            exit 1
          fi
          python scripts/pylint_regression_gate.py ci \
            --report pylint-report.json \
            --pylint-status "${PYLINT_STATUS}" \
            --branch-baseline ci/pylint-baseline.json \
            --base-ref "${BASE_REF}"

      - name: Upload Pylint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.json
          if-no-files-found: ignore

  pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1

      - name: Log pytest version
        run: python -m pytest --version

      - name: Prepare hermetic CI config
        run: |
          mkdir -p /tmp/convmem-ci
          sed 's|~/.local/share/convmem|/tmp/convmem-ci/nodata|g' config.example.toml \
            > /tmp/convmem-ci/config.toml
          chmod +x scripts/restic-ensure-chroma-snapshot.sh scripts/restic-copy-external.sh

      - name: Check critical invariant manifest
        env:
          CONVMEM_CONFIG: /tmp/convmem-ci/config.toml
        run: python scripts/check_ci_critical_invariants.py

      - name: Run pytest
        env:
          CONVMEM_CONFIG: /tmp/convmem-ci/config.toml
        run: python -m pytest -q
